name: calisthenics

services:
  mongo:
    image: mongo:7
    container_name: calisthenics-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: calisthenics-tracker
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: calisthenics-backend:latest
    container_name: calisthenics-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      MONGODB_URI: mongodb://mongo:27017/calisthenics-tracker
      USE_MEMORY_DB: "false"
      MONGO_CONNECT_RETRIES: "20"
      MONGO_RETRY_DELAY_MS: "2000"
      CORS_ALLOWED_HOSTS: ${CORS_ALLOWED_HOSTS}
      SPORTS_PROJECT_ROOT: /sports
      GARMIN_EMAIL: ${GARMIN_EMAIL:-}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:-}
      SPORTS_GOALS_FILE: ${SPORTS_GOALS_FILE:-}
      SPORTS_SYNC_PAGE_SIZE: ${SPORTS_SYNC_PAGE_SIZE:-100}
      SPORTS_SYNC_MAX_ACTIVITIES: ${SPORTS_SYNC_MAX_ACTIVITIES:-2000}
      SPORTS_UPLOAD_MAX_MB: ${SPORTS_UPLOAD_MAX_MB:-25}
      SPORTS_CREDENTIALS_SECRET: ${SPORTS_CREDENTIALS_SECRET}
      SPORTS_ENV_FILE: ${SPORTS_ENV_FILE:-/sports/.env}
    env_file:
      - /home/guido/code/sports/.env
    volumes:
      - /home/guido/code/sports:/sports:ro
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: calisthenics-frontend:latest
    container_name: calisthenics-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
    external: true
    name: remote_mongo-data
